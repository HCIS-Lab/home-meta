SESS=home
PWD=$(pwd)

kill-session -t $SESS
new-session -s $SESS -d

rename-window -t $SESS:0 "admin"

new-window -t $SESS -n "sensor"
split-window -t $SESS:"sensor"

new-window -t $SESS -n "action"
split-window -h -t $SESS:"action"
split-window -v -t $SESS:"action".0
split-window -v -t $SESS:"action".2
split-window -v -t $SESS:"action".3

# home_nlp
send-keys -t $SESS:"sensor".0 "# Setting up NLP environment..." C-m
send-keys -t $SESS:"sensor".0 "mkdir -p venvs" C-m
send-keys -t $SESS:"sensor".0 "if [ ! -d 'venvs/home_nlp' ]; then python3 -m venv venvs/home_nlp --system-site-packages; fi" C-m
send-keys -t $SESS:"sensor".0 ". venvs/home_nlp/bin/activate" C-m
send-keys -t $SESS:"sensor".0 "python3 -m pip install -r src/home_nlp/requirements.txt" C-m
send-keys -t $SESS:"sensor".0 "python3 -m colcon build --symlink-install --event-handlers console_cohesion+ --base-paths src --packages-select home_nlp" C-m
send-keys -t $SESS:"sensor".0 ". install/setup.bash" C-m
send-keys -t $SESS:"sensor".0 "ros2 launch home_nlp launch.py" C-m

# yolo_ros
send-keys -t $SESS:"sensor".1 "# Setting up YOLO environment..." C-m
send-keys -t $SESS:"sensor".1 "mkdir -p venvs" C-m
send-keys -t $SESS:"sensor".1 "python3 -m venv venvs/yolo_ros --system-site-packages" C-m
send-keys -t $SESS:"sensor".1 ". venvs/yolo_ros/bin/activate" C-m
send-keys -t $SESS:"sensor".1 "python3 -m pip install -r src/yolo_ros/requirements.txt" C-m
send-keys -t $SESS:"sensor".1 "python3 -m pip install git+https://github.com/openai/CLIP.git" C-m
send-keys -t $SESS:"sensor".1 "python3 -m colcon build --symlink-install --event-handlers console_cohesion+ --base-paths src --packages-select yolo_msgs yolo_ros yolo_bringup" C-m
send-keys -t $SESS:"sensor".1 ". install/setup.bash" C-m
send-keys -t $SESS:"sensor".1 "ros2 launch yolo_bringup yolo.launch.py model_type:=YOLOE model:=yoloe-11s-seg.pt use_3d:=True use_tracking:=False target_frame:=link_grasp_center input_image_topic:=/gripper_camera/color/image_rect_raw/compressed input_depth_topic:=/gripper_camera/aligned_depth_to_color/image_raw/compressedDepth input_depth_info_topic:=/gripper_camera/aligned_depth_to_color/camera_info device:=cuda:0" C-m

# home_grasp
send-keys -t $SESS:"action".0 "mkdir -p venvs" C-m
send-keys -t $SESS:"action".0 "if [ ! -d 'venvs/home_grasp' ]; then python3 -m venv venvs/home_grasp --system-site-packages; fi" C-m
send-keys -t $SESS:"action".0 ". venvs/home_grasp/bin/activate" C-m
#send-keys -t $SESS:"action".0 "python3 -m pip install -r src/home_grasp/requirements.txt" C-m
send-keys -t $SESS:"action".0 "python3 -m colcon build --symlink-install --event-handlers console_cohesion+ --base-paths src --packages-select home_grasp" C-m
send-keys -t $SESS:"action".0 ". install/setup.bash" C-m
send-keys -t $SESS:"action".0 "ros2 run home_grasp grasp_node" C-m

# home_speak
send-keys -t $SESS:"action".1 "mkdir -p venvs" C-m
send-keys -t $SESS:"action".1 "if [ ! -d 'venvs/home_speak' ]; then python3 -m venv venvs/home_speak --system-site-packages; fi" C-m
send-keys -t $SESS:"action".1 ". venvs/home_speak/bin/activate" C-m
send-keys -t $SESS:"action".1 "python3 -m pip install -r src/home_speak/requirements.txt" C-m
send-keys -t $SESS:"action".1 "python3 -m colcon build --symlink-install --event-handlers console_cohesion+ --base-paths src --packages-select home_speak" C-m
send-keys -t $SESS:"action".1 ". install/setup.bash" C-m
send-keys -t $SESS:"action".1 "ros2 run home_speak speak_node" C-m # TODO launch file?

# home_navigate
send-keys -t $SESS:"action".2 "mkdir -p venvs" C-m
send-keys -t $SESS:"action".2 "if [ ! -d 'venvs/home_navigate' ]; then python3 -m venv venvs/home_navigate --system-site-packages; fi" C-m
send-keys -t $SESS:"action".2 ". venvs/home_navigate/bin/activate" C-m
#send-keys -t $SESS:"action".2 "python3 -m pip install -r src/home_navigate/requirements.txt" C-m
send-keys -t $SESS:"action".2 "python3 -m colcon build --symlink-install --event-handlers console_cohesion+ --base-paths src --packages-select home_navigate && tmux wait-for -S venv_build_done" C-m

send-keys -t $SESS:"action".3 "tmux wait-for venv_build_done && . install/setup.bash && ros2 run home_navigate search_object_server" C-m

send-keys -t $SESS:"action".4 "tmux wait-for venv_build_done && . install/setup.bash && ros2 run home_navigate approach_server" C-m

select-window -t $SESS:"admin"
attach -t $SESS
